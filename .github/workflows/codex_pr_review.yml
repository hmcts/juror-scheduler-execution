name: Codex PR Review Feedback

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    uses: hmcts/codex-agent-workflows/.github/workflows/codex-review-feedback.yml@4d33c9d256e07b5df97493b28ffcd1955d3f2082
    with:
      runner_label: codex-juror-scheduler-execution-aks
      node_version: "22"
      github_app_client_id: ${{ vars.CODEX_GITHUB_APP_CLIENT_ID }}
      sonar_host_url: https://sonarcloud.io
      sonar_project_key: uk.gov.hmcts.juror:juror-scheduler-execution
    secrets:
      CODEX_OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}
      CODEX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_GITHUB_APP_PRIVATE_KEY }}
      CODEX_JIRA_PR_NOTIFY_URL: ${{ secrets.CODEX_JIRA_PR_NOTIFY_URL }}
      CODEX_SONAR_TOKEN: ${{ secrets.CODEX_SONAR_TOKEN }}
