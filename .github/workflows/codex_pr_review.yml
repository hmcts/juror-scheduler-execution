name: Codex PR Review Feedback

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    uses: hmcts/codex-agent-workflows/.github/workflows/codex-review-feedback.yml@2cd983caa8460d995ca404250451e5d1b5000283
    with:
      runner_label: codex-juror-scheduler-execution-aks
      node_version: "22"
      publisher_login: ${{ vars.BOT_PUBLISHER_LOGIN }}
      sonar_host_url: https://sonarcloud.io
      sonar_project_key: uk.gov.hmcts.juror:juror-scheduler-execution
    secrets:
      CODEX_OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      CODEX_SONAR_TOKEN: ${{ secrets.CODEX_SONAR_TOKEN }}
